<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  @font-face {
    font-family: 'MMRock9';
    src: url('/font/mmrock9/MMRock9.ttf');
  }

  :root {
    --speak-color: #23a55a;
    --speak-name-color: #57f287;
    --name-color: #e0e0e0;
    --bg-opacity: 0.65;
    --name-bg-opacity: 0;
    --name-bg-radius: 0px;
    --bg-radius: 0px;
  }

  body {
    background: transparent;
    font-family: 'MMRock9', monospace;
    overflow: hidden;
  }

  /* ── Overlay shell ────────────────────────────────── */
  #overlay {
    position: fixed;
    display: flex;
    flex-direction: column;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events: none;
  }
  #overlay.visible { opacity: 1 !important; transform: translate(0,0) !important; }

  /* Position classes */
  #overlay.pos-bottom-left   { bottom: 24px; left: 20px;  transform: translateX(-16px); }
  #overlay.pos-bottom-right  { bottom: 24px; right: 20px; transform: translateX(16px);  }
  #overlay.pos-top-left      { top: 24px;    left: 20px;  transform: translateX(-16px); }
  #overlay.pos-top-right     { top: 24px;    right: 20px; transform: translateX(16px);  }
  /* Center screen positions — span full width, align content to center */
  #overlay.pos-bottom-center { bottom: 24px; left: 0; right: 0; align-items: center; }
  #overlay.pos-top-center    { top: 24px;    left: 0; right: 0; align-items: center; }
  /* Mid screen positions — span full height, center vertically */
  #overlay.pos-mid-left   { top: 0; bottom: 0; left: 20px;  justify-content: center; transform: translateX(-16px); }
  #overlay.pos-mid-right  { top: 0; bottom: 0; right: 20px; justify-content: center; transform: translateX(16px);  }
  #overlay.pos-mid-center { top: 0; bottom: 0; left: 0; right: 0; justify-content: center; align-items: center; }

  /* Scale wrapper — zoom set by JS for crisp pixel rendering */
  #overlay-scale {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  /* ── Channel label ─────────────────────────────────── */
  #channel-label {
    font-size: 7px;
    color: #ffffff;
    text-shadow: 1px 1px 0 #000, 2px 2px 0 rgba(0,0,0,0.6);
    letter-spacing: 0.14em;
    background: rgba(0,0,0,var(--bg-opacity));
    padding: 4px 8px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-radius: var(--bg-radius);
  }

  /* ── Members list — rows built by JS with per-row justify-content ── */
  #members-list { display: flex; flex-direction: column; gap: 4px; }

  /* ── SQUARE design ─────────────────────────────────── */

  #overlay.design-square .member-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px 5px 5px;
    background: rgba(0,0,0,var(--bg-opacity));
    border-radius: var(--bg-radius);
  }
  #overlay.design-square .avatar-wrap { width: 48px; height: 48px; }
  #overlay.design-square .avatar-wrap img,
  #overlay.design-square .avatar-placeholder {
    width: 48px; height: 48px;
    border-radius: 0;
    display: block; object-fit: cover;
  }
  #overlay.design-square .speak-ring {
    position: absolute; inset: -3px;
    border: 3px solid transparent;
    border-radius: 0;
    pointer-events: none;
  }
  #overlay.design-square .member-name {
    font-size: var(--name-size, 12px);
    letter-spacing: 0.05em;
    text-shadow: 1px 1px 0 #000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 60px;
  }

  /* ── MODERN design ─────────────────────────────────── */
  #overlay.design-modern #members-list {
    gap: 6px;
    padding: 2px;
  }

  #overlay.design-modern .member-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 10px 6px;
    background: rgba(0,0,0,var(--bg-opacity));
    min-width: 88px;
    border-radius: var(--bg-radius);
  }
  #overlay.design-modern .avatar-wrap { width: 68px; height: 68px; }
  #overlay.design-modern .avatar-wrap img,
  #overlay.design-modern .avatar-placeholder {
    width: 68px; height: 68px;
    border-radius: 50%;
    display: block; object-fit: cover;
  }
  #overlay.design-modern .avatar-placeholder { font-size: 24px; }
  #overlay.design-modern .speak-ring {
    position: absolute; inset: -3px;
    border: 3px solid transparent;
    border-radius: 50%;
    pointer-events: none;
  }
  #overlay.design-modern .member-name {
    font-size: var(--name-size, 12px);
    letter-spacing: 0.05em;
    text-shadow: 1px 1px 0 #000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
    width: 100%;
  }

  /* ── Layout overrides ── */
  #overlay.layout-stacked .member-row { flex-direction: column !important; align-items: center !important; }
  #overlay.layout-stacked .member-name { text-align: center !important; flex: unset !important; min-width: unset !important; width: 100% !important; }
  #overlay.layout-list .member-row { flex-direction: row !important; align-items: center !important; }
  #overlay.layout-list .member-name { text-align: left !important; flex: 1 !important; width: auto !important; }

  /* ── Shared ────────────────────────────────────────── */
  .avatar-wrap { position: relative; flex-shrink: 0; }
  .avatar-placeholder {
    background: #5865f2;
    display: flex; align-items: center; justify-content: center;
    color: #fff; letter-spacing: 0;
  }

  @keyframes speak-pulse {
    0%   { box-shadow: 0 0 5px rgba(35,165,90,0.5); }
    15%  { box-shadow: 0 0 12px rgba(35,165,90,0.9); }
    35%  { box-shadow: 0 0 5px rgba(35,165,90,0.4); }
    55%  { box-shadow: 0 0 14px rgba(35,165,90,1); }
    75%  { box-shadow: 0 0 6px rgba(35,165,90,0.5); }
    90%  { box-shadow: 0 0 10px rgba(35,165,90,0.8); }
    100% { box-shadow: 0 0 5px rgba(35,165,90,0.5); }
  }

  #overlay .member-row.speaking .speak-ring {
    border-color: var(--speak-color) !important;
    animation: speak-pulse 2.3s ease-in-out infinite;
  }
  .member-name {
    color: var(--name-color); transition: color 0.1s;
    background: rgba(0,0,0,var(--name-bg-opacity));
    padding: 1px 4px;
    border-radius: var(--name-bg-radius);
    box-shadow: inset 1px 1px 0 rgba(255,255,255,calc(var(--name-bg-opacity) * 0.12)), inset -1px -1px 0 rgba(0,0,0,calc(var(--name-bg-opacity) * 0.6));
  }
  #overlay .member-row.speaking .member-name { color: var(--speak-name-color); }

  .status-icon {
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    letter-spacing: 0;
  }
  #overlay.hide-name .member-name { display: none !important; }
  #overlay.limit-card-width .member-row { width: var(--card-max-width); overflow: hidden; }
  #overlay.limit-card-width .member-name { flex: unset !important; min-width: 0 !important; margin-left: var(--name-ml, 0) !important; margin-right: var(--name-mr, auto) !important; }
</style>
</head>
<body>

<div id="overlay" class="pos-bottom-left design-square">
  <div id="overlay-scale">
    <div id="channel-label"></div>
    <div id="members-list" class="align-left"></div>
  </div>
</div>

<script>
  let lastMemberIds = '';
  let lastSpeaking  = '';
  let lastSettingsStr = '';
  let lastCfgKey = '';
  let lastMuteKey = '';

  async function fetchData() {
    try {
      const endpoint = location.pathname === '/discord-overlay-2' ? '/discord-overlay-2-data' : '/discord-overlay-data';
      const r = await fetch(endpoint);
      const d = await r.json();
      if (d.overlaySettings) applySettings(d.overlaySettings);
      if (d.globalFont) applyFont(d.globalFont, d.globalFontPath);
      render(d);
    } catch(e) {}
  }

  function applySettings(cfg) {
    const str = JSON.stringify(cfg);
    if (str === lastSettingsStr) return;
    lastSettingsStr = str;

    const overlay  = document.getElementById('overlay');
    const scaleEl  = document.getElementById('overlay-scale');
    const list     = document.getElementById('members-list');
    const chanLabel = document.getElementById('channel-label');
    const root     = document.documentElement;

    // Position
    ['pos-bottom-left','pos-bottom-center','pos-bottom-right','pos-top-left','pos-top-center','pos-top-right','pos-mid-left','pos-mid-center','pos-mid-right'].forEach(c => overlay.classList.remove(c));
    const pos = cfg.position || 'bottom-left';
    overlay.classList.add('pos-' + pos);

    // Scale — use zoom for crisp pixel-perfect rendering
    scaleEl.style.zoom = cfg.scale || 1;
    scaleEl.style.position = 'relative';
    scaleEl.style.top = -(cfg.heightOffset || 0) + 'px';

    // Design
    ['design-square','design-modern'].forEach(c => overlay.classList.remove(c));
    overlay.classList.add('design-' + (cfg.design || 'square'));

    // Colors
    root.style.setProperty('--speak-color',      cfg.speakColor     || '#23a55a');
    root.style.setProperty('--speak-name-color',  cfg.speakNameColor || '#57f287');
    root.style.setProperty('--name-color',         cfg.nameColor      || '#e0e0e0');
    root.style.setProperty('--bg-opacity',         cfg.bgOpacity      != null ? cfg.bgOpacity : 0.65);

    // Channel label visibility
    if (chanLabel) chanLabel.style.display = cfg.showChannelLabel !== false ? '' : 'none';

    root.style.setProperty('--name-bg-opacity',  cfg.nameBgOpacity  != null ? cfg.nameBgOpacity  : 0);
    root.style.setProperty('--name-bg-radius',   (cfg.nameBgRadius  != null ? cfg.nameBgRadius   : 0) + 'px');
    root.style.setProperty('--bg-radius',        (cfg.bgRadius      != null ? cfg.bgRadius        : 0) + 'px');

    // Stacked vs list layout
    ['layout-stacked', 'layout-list'].forEach(c => overlay.classList.remove(c));
    const effectiveStacked = cfg.stackedLayout != null ? cfg.stackedLayout : (cfg.design === 'modern');
    overlay.classList.add(effectiveStacked ? 'layout-stacked' : 'layout-list');

    // Name visibility
    overlay.classList.toggle('hide-name', cfg.showMemberName === false);

    // Name size
    root.style.setProperty('--name-size', (cfg.nameSize != null ? cfg.nameSize : 12) + 'px');

    // Card max-width
    if (cfg.nameLengthEnabled) {
      root.style.setProperty('--card-max-width', (cfg.nameLength != null ? cfg.nameLength : 120) + 'px');
      overlay.classList.add('limit-card-width');
    } else {
      root.style.setProperty('--card-max-width', 'none');
      overlay.classList.remove('limit-card-width');
    }

    // Name alignment within card
    const nameAlign = cfg.nameAlign || 'left';
    root.style.setProperty('--name-ml', nameAlign === 'left'   ? '0'    : 'auto');
    root.style.setProperty('--name-mr', nameAlign === 'right'  ? '0'    : 'auto');
  }

  function applyFont(fontName, fontPath) {
    if (!fontName || fontName === 'MMRock9') {
      document.body.style.fontFamily = "'MMRock9', monospace";
      return;
    }
    if (fontName === 'monospace' || fontName === 'sans-serif') {
      document.body.style.fontFamily = fontName;
      return;
    }
    if (fontPath && !document.querySelector('style[data-font="' + fontName + '"]')) {
      const st = document.createElement('style');
      st.setAttribute('data-font', fontName);
      st.textContent = "@font-face { font-family:'" + fontName + "'; src:url('/font/" + fontPath + "'); }";
      document.head.appendChild(st);
    }
    document.body.style.fontFamily = "'" + fontName + "', monospace";
  }

  window.addEventListener('message', e => {
    if (e.data && e.data.type === 'discordSettings') applySettings(e.data.cfg);
    if (e.data && e.data.type === 'discordFont') applyFont(e.data.font, e.data.fontPath);
  });

  function render(d) {
    const overlay   = document.getElementById('overlay');
    const chanLabel = document.getElementById('channel-label');
    const list      = document.getElementById('members-list');

    if (d.status !== 'authenticated' || !d.channel) {
      overlay.classList.remove('visible');
      return;
    }

    overlay.classList.add('visible');

    const guild = d.guildName || '';
    const chan  = d.channel.name || '';
    chanLabel.textContent = guild ? guild + '  ·  ' + chan : chan;

    const members  = d.channel.members || [];
    const speaking = d.speaking || [];
    const memberIds = members.map(m => m.id).join(',');
    const speakStr  = speaking.slice().sort().join(',');
    const muteKey   = members.map(m => m.id + ':' + (m.selfMute?1:0) + (m.selfDeaf?1:0)).join(',');
    const cfg       = d.overlaySettings || {};
    const hiddenKey = (cfg.hiddenMembers || []).slice().sort().join(',');
    const effectiveStacked = cfg.stackedLayout != null ? cfg.stackedLayout : (cfg.design === 'modern');
    const cfgKey    = (cfg.cols||4)+'|'+(cfg.rows||0)+'|'+(cfg.align||'left')+'|'+(cfg.design||'square')+'|'+hiddenKey+'|'+effectiveStacked+'|'+(cfg.showStatusIcons!==false?1:0)+'|'+(cfg.useServerNick!==false?1:0)+'|'+(cfg.useServerAvatar!==false?1:0);

    if (memberIds !== lastMemberIds || cfgKey !== lastCfgKey || muteKey !== lastMuteKey) {
      list.innerHTML = '';
      buildRows(list, members, speaking, cfg);
      // Auto-zoom: shrink toward canvas edge, recover when there's room
      const scaleEl = document.getElementById('overlay-scale');
      if (scaleEl) requestAnimationFrame(() => {
        const userZoom   = cfg.scale || 1;
        const curZoom    = parseFloat(scaleEl.style.zoom) || userZoom;
        const renderedW  = list.getBoundingClientRect().width;
        const naturalW   = curZoom > 0 ? renderedW / curZoom : renderedW;
        const autoZoom   = naturalW > 0 ? Math.min(userZoom, window.innerWidth / naturalW) : userZoom;
        scaleEl.style.zoom = Math.max(0.1, autoZoom);
      });
      lastMemberIds = memberIds;
      lastSpeaking  = speakStr;
      lastCfgKey    = cfgKey;
      lastMuteKey   = muteKey;
    } else if (speakStr !== lastSpeaking) {
      members.forEach(m => {
        const row = document.getElementById('dr-' + m.id);
        if (!row) return;
        if (speaking.includes(m.id)) row.classList.add('speaking');
        else                          row.classList.remove('speaking');
      });
      lastSpeaking = speakStr;
    }
  }

  function buildRows(container, members, speaking, cfg) {
    const hidden  = cfg.hiddenMembers || [];
    members = members.filter(m => !hidden.includes(m.id));

    // How many avatars fit across the canvas at the current zoom level
    const zoom       = cfg.scale || 1;
    const design     = cfg.design || 'square';
    const avatarPx   = design === 'modern' ? 94 : 56; // px per avatar slot including gap at zoom=1
    const fitCols    = Math.max(1, Math.floor((window.innerWidth / zoom) / avatarPx));

    const cols    = Math.min(Math.max(1, cfg.cols || 4), fitCols);
    const maxRows = cfg.rows || 0;
    const align   = cfg.align || 'left';
    const justify = { left:'flex-start', center:'center', right:'flex-end' }[align] || 'flex-start';

    let total = members.length;
    if (maxRows > 0) total = Math.min(total, cols * maxRows);

    const numRows = Math.ceil(total / cols) || 0;
    for (let r = 0; r < numRows; r++) {
      const rowEl = document.createElement('div');
      rowEl.style.cssText = 'display:flex;gap:4px;justify-content:' + justify + ';';
      for (let i = r * cols; i < Math.min(r * cols + cols, total); i++) {
        addMemberRow(rowEl, members[i], speaking.includes(members[i].id), cfg);
      }
      container.appendChild(rowEl);
    }

    // Shrink font up to 4pt before truncating — runs after layout is complete
    requestAnimationFrame(() => {
      container.querySelectorAll('.member-name').forEach(el => {
        const baseSize = parseFloat(getComputedStyle(el).fontSize);
        let size = baseSize;
        while (el.scrollWidth > el.offsetWidth + 1 && size > baseSize - 4) {
          size -= 1;
          el.style.fontSize = size + 'px';
        }
      });
    });
  }

  function addMemberRow(container, m, isSpeaking, cfg) {
    const showIcons = cfg.showStatusIcons !== false;
    const row = document.createElement('div');
    row.className = 'member-row' + (isSpeaking ? ' speaking' : '');
    row.id = 'dr-' + m.id;

    const avatarWrap = document.createElement('div');
    avatarWrap.className = 'avatar-wrap';

    const avatarSrc = (cfg.useServerAvatar !== false && m.serverAvatar) ? m.serverAvatar : m.avatar;
    if (avatarSrc) {
      const img = document.createElement('img');
      img.src = avatarSrc;
      img.onerror = () => { img.replaceWith(makePlaceholder(m)); };
      avatarWrap.appendChild(img);
    } else {
      avatarWrap.appendChild(makePlaceholder(m));
    }

    const ring = document.createElement('div');
    ring.className = 'speak-ring';
    // stagger blink offset so members don't pulse in sync
    const idHash = (m.id || '').split('').reduce((a, c) => a + c.charCodeAt(0), 0);
    ring.style.animationDelay = ((idHash % 23) * 0.1).toFixed(1) + 's';
    avatarWrap.appendChild(ring);

    const nameEl = document.createElement('div');
    nameEl.className = 'member-name';
    const _acct = m.accountUsername || m.username || '';
    nameEl.textContent = (cfg.useServerNick !== false && m.nick)
      ? m.nick
      : _acct.charAt(0).toUpperCase() + _acct.slice(1);

    row.appendChild(avatarWrap);
    row.appendChild(nameEl);

    if (showIcons && (m.selfMute || m.selfDeaf)) {
      const icon = document.createElement('div');
      icon.className = 'status-icon';
      if (m.selfDeaf) {
        icon.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"><path d="M3 3l18 18"/><path d="M18.5 17A6 6 0 0 0 6 12v-2"/><path d="M6.5 6.5A6 6 0 0 1 18 12v1"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>';
      } else {
        icon.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="3" x2="21" y2="21"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V6a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>';
      }
      row.appendChild(icon);
    }

    container.appendChild(row);
  }

  function makePlaceholder(m) {
    const div = document.createElement('div');
    div.className = 'avatar-placeholder';
    div.textContent = (m.nick || m.username || '?')[0].toUpperCase();
    return div;
  }

  fetchData();
  setInterval(fetchData, 400);
</script>
</body>
</html>
