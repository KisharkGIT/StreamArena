<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Poll Overlay – Horizontal</title>
<style>
  @font-face { font-family: 'MMRock9'; src: url('/fonts/MMRock9.ttf'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }

  #root {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    height: 100%;
    padding: 16px;
    opacity: 0;
    transition: opacity 1.5s ease;
    position: relative;
  }
  #root.visible { opacity: 1; }

  #poll-bg {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 80%;
    height: 80%;
    background: transparent;
    border-radius: 0;
    pointer-events: none;
    z-index: 0;
  }

  #particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 10;
  }

  #winner-label {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'MMRock9', monospace;
    font-size: 22px;
    color: #fff;
    text-shadow: 3px 3px 0 #000, -1px -1px 0 #000;
    letter-spacing: 0.08em;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    z-index: 11;
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    position: relative;
    z-index: 1;
    flex: none;
  }

  .portrait-wrap {
    flex-shrink: 0;
    width: 80px;
    height: 80px;
    overflow: hidden;
    image-rendering: pixelated;
    border: 3px solid #000;
    position: relative;
    z-index: 2;
  }
  .portrait-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
  }
  .portrait-placeholder {
    width: 100%;
    height: 100%;
    background: #1a1a2e;
  }

  .bar-track-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow: visible;
  }

  .bar-track {
    width: 100%;
    height: 40px;
    background: rgba(255,255,255,0.06);
    position: relative;
    overflow: visible;
  }

  .bar-fill {
    height: 100%;
    width: 0%;
    transition: width 0.6s ease;
    position: relative;
    min-width: 2px;
  }
  #fill1 { background: #3a9fc8; }
  #fill2 { background: #ff6694; }

  .pct-label {
    position: absolute;
    left: calc(100% + 6px);
    top: 50%;
    transform: translateY(-50%);
    font-family: 'MMRock9', monospace;
    font-size: 18px;
    color: #fff;
    text-shadow: 2px 2px 0 #000;
    white-space: nowrap;
    pointer-events: none;
  }

  .votes-label {
    font-family: 'MMRock9', monospace;
    font-size: 12px;
    color: #aaa;
    text-shadow: 1px 1px 0 #000;
    text-align: left;
  }

  @keyframes winnerBounce {
    0%   { transform: translateX(0) scale(1); }
    15%  { transform: translateX(10px) scale(1.05); }
    30%  { transform: translateX(0) scale(1); }
    45%  { transform: translateX(6px) scale(1.03); }
    60%  { transform: translateX(0) scale(1); }
    75%  { transform: translateX(3px) scale(1.01); }
    100% { transform: translateX(0) scale(1); }
  }
  @keyframes winnerGlow {
    0%, 100% { filter: brightness(1) drop-shadow(0 0 0px transparent); }
    50%      { filter: brightness(1.6) drop-shadow(0 0 10px currentColor); }
  }
  .winner-anim {
    animation: winnerBounce 0.65s ease 3, winnerGlow 0.65s ease 3;
  }

  @keyframes winnerLabelIn {
    0%   { opacity: 0; transform: translateX(-50%) translateY(16px) scale(0.6); }
    50%  { opacity: 1; transform: translateX(-50%) translateY(-6px) scale(1.12); }
    70%  { transform: translateX(-50%) translateY(2px) scale(0.97); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }
  #winner-label.show {
    animation: winnerLabelIn 0.5s ease forwards;
  }

  @keyframes sparkleUp {
    0%   { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
    60%  { opacity: 0.8; }
    100% { opacity: 0; transform: translateY(-80px) scale(0.3) rotate(180deg); }
  }
  .particle {
    position: absolute;
    width: 8px;
    height: 8px;
    pointer-events: none;
    animation: sparkleUp 0.9s ease forwards;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<div id="root">
  <div id="poll-bg"></div>
  <div id="particles"></div>
  <div id="winner-label"></div>

  <div class="bar-row" id="bar-row1">
    <div class="portrait-wrap" id="portrait1"><div class="portrait-placeholder"></div></div>
    <div class="bar-track-wrap">
      <div class="bar-track" id="bar-track1">
        <div class="bar-fill" id="fill1">
          <span class="pct-label" id="pct1">0%</span>
        </div>
      </div>
      <div class="votes-label" id="votes1">0 votes</div>
    </div>
  </div>

  <div class="bar-row" id="bar-row2">
    <div class="portrait-wrap" id="portrait2"><div class="portrait-placeholder"></div></div>
    <div class="bar-track-wrap">
      <div class="bar-track" id="bar-track2">
        <div class="bar-fill" id="fill2">
          <span class="pct-label" id="pct2">0%</span>
        </div>
      </div>
      <div class="votes-label" id="votes2">0 votes</div>
    </div>
  </div>
</div>
<script>
  const root = document.getElementById('root');
  let wasActive = false;
  let animating = false;

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  function setPortrait(el, url) {
    if (url) {
      el.innerHTML = '<img src="' + url + '" alt="">';
    } else {
      el.innerHTML = '<div class="portrait-placeholder"></div>';
    }
  }

  function resetWinnerState() {
    const label = document.getElementById('winner-label');
    if (label) { label.className = ''; label.textContent = ''; label.style.opacity = '0'; }
    const parts = document.getElementById('particles');
    if (parts) parts.innerHTML = '';
    ['bar-row1', 'bar-row2'].forEach(id => {
      const row = document.getElementById(id);
      if (row) { row.classList.remove('winner-anim'); row.style.opacity = ''; row.style.transition = ''; }
    });
    ['fill1', 'fill2'].forEach(id => {
      const f = document.getElementById(id);
      if (f) { f.style.transition = 'width 0.6s ease'; f.style.filter = ''; }
    });
  }

  function fullReset() {
    resetWinnerState();
    document.getElementById('fill1').style.width = '0%';
    document.getElementById('fill2').style.width = '0%';
    document.getElementById('pct1').textContent = '0%';
    document.getElementById('pct2').textContent = '0%';
    document.getElementById('votes1').textContent = '0 votes';
    document.getElementById('votes2').textContent = '0 votes';
    setPortrait(document.getElementById('portrait1'), null);
    setPortrait(document.getElementById('portrait2'), null);
  }

  function spawnParticles(rowIdx, color) {
    const partsEl = document.getElementById('particles');
    if (!partsEl) return;
    const row = document.getElementById('bar-row' + rowIdx);
    if (!row) return;
    const colors = [color, '#ffffff', '#ffff66', color + 'bb'];
    const count = 12;
    const rowRect  = row.getBoundingClientRect();
    const rootRect = root.getBoundingClientRect();
    const relLeft = rowRect.left - rootRect.left;
    const relTop  = rowRect.top  - rootRect.top;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const px = relLeft + Math.random() * rowRect.width;
      const py = relTop  + Math.random() * rowRect.height;
      const sz = 4 + Math.floor(Math.random() * 6);
      p.style.cssText = [
        'left:' + px + 'px',
        'top:' + py + 'px',
        'width:' + sz + 'px',
        'height:' + sz + 'px',
        'background:' + colors[Math.floor(Math.random() * colors.length)],
        'animation-delay:' + (Math.random() * 0.4).toFixed(2) + 's',
        'animation-duration:' + (0.7 + Math.random() * 0.5).toFixed(2) + 's'
      ].join(';');
      partsEl.appendChild(p);
    }
    setTimeout(() => { if (partsEl) partsEl.innerHTML = ''; }, 1800);
  }

  async function playWinnerAnimation(d) {
    animating = true;
    const v1 = (d.votes && d.votes['1']) || 0;
    const v2 = (d.votes && d.votes['2']) || 0;

    if (v1 === 0 && v2 === 0) {
      root.classList.remove('visible');
      await sleep(1600);
      fullReset();
      animating = false;
      return;
    }

    const tied    = v1 === v2;
    const winIdx  = (!tied && v1 > v2) ? 1 : 2;
    const loseIdx = winIdx === 1 ? 2 : 1;

    // Phase 1 — shrink loser bar width to 0
    const loseRow  = document.getElementById('bar-row'  + loseIdx);
    const loseFill = document.getElementById('fill' + loseIdx);
    if (loseFill) { loseFill.style.transition = 'width 0.9s ease'; loseFill.style.width = '0%'; }
    if (loseRow)  { loseRow.style.transition  = 'opacity 0.7s ease'; loseRow.style.opacity = '0.18'; }

    await sleep(1050);

    if (!tied) {
      // Phase 2 — winner celebration
      const winRow   = document.getElementById('bar-row' + winIdx);
      const winFill  = document.getElementById('fill' + winIdx);
      const winColor = winIdx === 1
        ? (document.getElementById('fill1')?.style.background || '#3a9fc8')
        : (document.getElementById('fill2')?.style.background || '#ff6694');

      if (winRow)  winRow.classList.add('winner-anim');
      if (winFill) winFill.style.filter = 'brightness(1.5)';

      const label = document.getElementById('winner-label');
      if (label) {
        const name = winIdx === 1
          ? (d.p1 && d.p1.name ? d.p1.name.toUpperCase() + ' WINS!' : 'WINNER!')
          : (d.p2 && d.p2.name ? d.p2.name.toUpperCase() + ' WINS!' : 'WINNER!');
        label.textContent = name;
        label.style.color = winColor;
        label.style.textShadow = '3px 3px 0 #000, 0 0 12px ' + winColor + '88';
        label.style.opacity = '';
        label.className = 'show';
      }

      spawnParticles(winIdx, winColor);

      await sleep(1950);
    }

    animating = false;
  }

  function _shadowCss(sh) {
    if (!sh) sh = {};
    var a = sh.angle != null ? sh.angle : 135, d = sh.distance != null ? sh.distance : 8;
    var blur = sh.hardness != null ? sh.hardness : 0, spread = sh.spread != null ? sh.spread : 0;
    var color = sh.color || '#000000', op = sh.opacity != null ? sh.opacity : 1;
    var rad = a * Math.PI / 180;
    var x = Math.round(d * Math.sin(rad)), y = Math.round(-d * Math.cos(rad));
    var r = parseInt(color.slice(1,3)||'00',16), g = parseInt(color.slice(3,5)||'00',16), b = parseInt(color.slice(5,7)||'00',16);
    var col = 'rgba('+r+','+g+','+b+','+op+')';
    var val = x+'px '+y+'px '+blur+'px '+col;
    if (spread > 0) val += ', '+x+'px '+y+'px '+(blur+spread)+'px rgba('+r+','+g+','+b+','+Math.max(0,+(op-0.35).toFixed(2))+')';
    return val;
  }

  function applyPollSettings(ps) {
    if (!ps) return;
    const p1Color     = ps.p1Color     || '#3a9fc8';
    const p2Color     = ps.p2Color     || '#ff6694';
    const p1TextColor = ps.p1TextColor || p1Color;
    const p2TextColor = ps.p2TextColor || p2Color;
    const textShadow  = _shadowCss(ps.shadow);
    const barWidth = ps.barWidth || 40;
    const barGap   = ps.barGap   || 12;
    const bgOpacity = ps.bgOpacity != null ? ps.bgOpacity : 0;
    const bgRadius  = ps.bgRadius  != null ? ps.bgRadius  : 0;
    const bgWidth   = ps.bgWidth   != null ? ps.bgWidth   : 80;
    const bgHeight  = ps.bgHeight  != null ? ps.bgHeight  : 80;
    const barRadius = ps.barRadius != null ? ps.barRadius : 0;
    const pctSize   = ps.pctSize   || 18;
    const voteSize  = ps.voteSize  || 12;
    const pfpSize   = ps.pfpSize   || 80;
    const pfpShape  = ps.pfpShape  || 'square';

    root.style.gap = barGap + 'px';

    const bgEl = document.getElementById('poll-bg');
    if (bgEl) {
      bgEl.style.background   = bgOpacity > 0 ? 'rgba(3,12,28,' + bgOpacity + ')' : 'transparent';
      bgEl.style.borderRadius = bgRadius + 'px';
      bgEl.style.width        = bgWidth  + '%';
      bgEl.style.height       = bgHeight + '%';
    }

    const winLabel = document.getElementById('winner-label');
    if (winLabel) {
      const rootH = (root && root.clientHeight) ? root.clientHeight : 600;
      const bgTopPx = rootH * (1 - Math.min(bgHeight, 100) / 100);
      winLabel.style.top = Math.max(4, bgTopPx - 40) + 'px';
    }

    // Bar track height = barWidth setting (horizontal bars use height for thickness)
    const t1 = document.getElementById('bar-track1'); if (t1) t1.style.height = barWidth + 'px';
    const t2 = document.getElementById('bar-track2'); if (t2) t2.style.height = barWidth + 'px';

    const f1 = document.getElementById('fill1'); if (f1) { f1.style.background = p1Color; f1.style.borderRadius = barRadius + 'px'; }
    const f2 = document.getElementById('fill2'); if (f2) { f2.style.background = p2Color; f2.style.borderRadius = barRadius + 'px'; }

    const pct1el = document.getElementById('pct1'); if (pct1el) { pct1el.style.color = p1TextColor; pct1el.style.fontSize = pctSize + 'px'; pct1el.style.textShadow = textShadow; }
    const pct2el = document.getElementById('pct2'); if (pct2el) { pct2el.style.color = p2TextColor; pct2el.style.fontSize = pctSize + 'px'; pct2el.style.textShadow = textShadow; }

    const v1el = document.getElementById('votes1'); if (v1el) { v1el.style.color = p1TextColor + 'aa'; v1el.style.fontSize = voteSize + 'px'; v1el.style.textShadow = textShadow; }
    const v2el = document.getElementById('votes2'); if (v2el) { v2el.style.color = p2TextColor + 'aa'; v2el.style.fontSize = voteSize + 'px'; v2el.style.textShadow = textShadow; }

    [document.getElementById('portrait1'), document.getElementById('portrait2')].forEach(p => {
      if (!p) return;
      p.style.width        = pfpSize + 'px';
      p.style.height       = pfpSize + 'px';
      p.style.borderRadius = pfpShape === 'modern' ? '50%' : '0';
    });
  }

  async function poll() {
    if (animating) return;
    try {
      const r = await fetch('/poll-status');
      const d = await r.json();

      applyPollSettings(d.pollSettings);

      if (d.active) {
        if (!wasActive) resetWinnerState();
        wasActive = true;
        root.classList.add('visible');

        setPortrait(document.getElementById('portrait1'), d.p1 && d.p1.imageUrl);
        setPortrait(document.getElementById('portrait2'), d.p2 && d.p2.imageUrl);

        document.getElementById('fill1').style.width  = d.p1Pct + '%';
        document.getElementById('fill2').style.width  = d.p2Pct + '%';
        document.getElementById('pct1').textContent   = Math.round(d.p1Pct) + '%';
        document.getElementById('pct2').textContent   = Math.round(d.p2Pct) + '%';
        document.getElementById('votes1').textContent = d.votes['1'] + ' vote' + (d.votes['1'] !== 1 ? 's' : '');
        document.getElementById('votes2').textContent = d.votes['2'] + ' vote' + (d.votes['2'] !== 1 ? 's' : '');
      } else {
        if (wasActive) {
          wasActive = false;
          playWinnerAnimation(d).catch(() => { animating = false; });
        }
      }
    } catch(e) {}
  }

  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>
