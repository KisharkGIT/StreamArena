<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --widget-font: 'MMRock9'; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; width:100vw; height:100vh; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  #clock-label { font-family:var(--widget-font,'MMRock9'),monospace; font-size:28px; color:#aaa; letter-spacing:0.15em; text-transform:uppercase; text-shadow:6px 6px 0 #000; }
  #clock-time  { font-family:var(--widget-font,'MMRock9'),monospace; font-size:96px; color:#fff; letter-spacing:0.05em; text-shadow:6px 6px 0 #000; }
</style>
</head>
<body>
<div id="clock-label">Be Right Back</div>
<div id="clock-time">--:--</div>
<script>
  async function loadConfig() {
    try {
      const r = await fetch('/settings'); const d = await r.json();
      const w = d.brb && d.brb.widgets && d.brb.widgets.clock || {};
      const font = (d.brb && d.brb.globalFont) || 'MMRock9';
      
      document.getElementById('clock-label').textContent = w.label || 'Be Right Back';
      window._clockFmt = w.format || '12h';
    } catch(e) {}
  }

  function tick() {
    const now = new Date();
    const fmt = window._clockFmt || '12h';
    let timeStr;
    if (fmt === '24h') {
      timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    } else {
      let h = now.getHours() % 12 || 12;
      const m = now.getMinutes().toString().padStart(2,'0');
      timeStr = h + ':' + m + (now.getHours() >= 12 ? ' PM' : ' AM');
    }
    document.getElementById('clock-time').textContent = timeStr;
  }

  loadConfig();
  tick();
  setInterval(tick, 1000);
  setInterval(loadConfig, 10000); // reload config every 10s to pick up label/font changes

  async function loadGlobalFont() {
    try {
      const r = await fetch('/settings');
      const d = await r.json();
      const font = (d.brb && d.brb.globalFont) || 'MMRock9';
      if (font !== 'monospace' && font !== 'sans-serif') {
        if (!document.querySelector('style[data-font="' + font + '"]')) {
          const style = document.createElement('style');
          style.setAttribute('data-font', font);
          style.textContent = "@font-face { font-family:'" + font + "'; src:url('/font/" + font + ".ttf') format('truetype'),url('/font/" + font + ".otf') format('opentype'),url('/font/" + font + ".woff2') format('woff2'); }";
          document.head.appendChild(style);
        }
      }
      document.documentElement.style.setProperty('--widget-font', "'" + font + "'");
    } catch(e) {}
  }
  loadGlobalFont();
  setInterval(loadGlobalFont, 10000);

</script>
</body>
</html>
