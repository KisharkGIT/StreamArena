<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Poll Overlay</title>
<style>
  @font-face { font-family: 'MMRock9'; src: url('/fonts/MMRock9.ttf'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }

  #root {
    display: flex;
    flex-direction: row;
    align-items: flex-end;
    justify-content: center;
    gap: 12px;
    width: 100%;
    height: 100%;
    padding: 12px 12px 16px 12px;
    opacity: 0;
    transition: opacity 1.5s ease;
    position: relative;
  }
  #root.visible { opacity: 1; }

  #poll-bg {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 300px;
    background: transparent;
    border-radius: 0;
    pointer-events: none;
    z-index: 0;
  }

  #particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 10;
  }

  #winner-label {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'MMRock9', monospace;
    font-size: 22px;
    color: #fff;
    text-shadow: 3px 3px 0 #000, -1px -1px 0 #000;
    letter-spacing: 0.08em;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    z-index: 11;
  }

  .bar-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    flex: none;
    height: 100%;
    gap: 0;
    position: relative;
    z-index: 1;
  }

  .bar-wrap {
    width: 40px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    image-rendering: pixelated;
    position: relative;
    z-index: 1;
  }

  .bar-fill {
    width: 100%;
    height: 0%;
    transition: height 0.6s ease;
  }
  #bar1 .bar-fill { background: #3a9fc8; }
  #bar2 .bar-fill { background: #ff6694; }

  .portrait-wrap {
    width: 80px;
    height: 80px;
    flex-shrink: 0;
    overflow: hidden;
    image-rendering: pixelated;
    border: 3px solid #000;
    position: relative;
    z-index: 2;
  }

  @keyframes winnerBounce {
    0%   { transform: translateY(0) scale(1); }
    15%  { transform: translateY(-24px) scale(1.08); }
    30%  { transform: translateY(0) scale(1); }
    45%  { transform: translateY(-14px) scale(1.04); }
    60%  { transform: translateY(0) scale(1); }
    75%  { transform: translateY(-7px) scale(1.02); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes winnerGlow {
    0%, 100% { filter: brightness(1) drop-shadow(0 0 0px transparent); }
    50%      { filter: brightness(1.6) drop-shadow(0 0 10px currentColor); }
  }
  .winner-anim {
    animation: winnerBounce 0.65s ease 3, winnerGlow 0.65s ease 3;
  }

  @keyframes winnerLabelIn {
    0%   { opacity: 0; transform: translateX(-50%) translateY(16px) scale(0.6); }
    50%  { opacity: 1; transform: translateX(-50%) translateY(-6px) scale(1.12); }
    70%  { transform: translateX(-50%) translateY(2px) scale(0.97); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }
  #winner-label.show {
    animation: winnerLabelIn 0.5s ease forwards;
  }

  @keyframes sparkleUp {
    0%   { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
    60%  { opacity: 0.8; }
    100% { opacity: 0; transform: translateY(-80px) scale(0.3) rotate(180deg); }
  }
  .particle {
    position: absolute;
    width: 8px;
    height: 8px;
    pointer-events: none;
    animation: sparkleUp 0.9s ease forwards;
    image-rendering: pixelated;
  }

  @keyframes loserShrink {
    0%   { opacity: 1; }
    100% { opacity: 0.2; }
  }

  .portrait-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
  }
  .portrait-placeholder {
    width: 100%;
    height: 100%;
    background: #1a1a2e;
  }

  .pct-label {
    font-family: 'MMRock9', monospace;
    font-size: 18px;
    color: #fff;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
    margin-top: 4px;
    text-align: center;
  }

  .votes-label {
    font-family: 'MMRock9', monospace;
    font-size: 12px;
    color: #aaa;
    text-shadow: 1px 1px 0 #000;
    margin-top: 2px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="root">
  <div id="poll-bg"></div>
  <div id="particles"></div>
  <div id="winner-label"></div>
  <div class="bar-col" id="bar1">
    <div class="bar-wrap" id="bar-wrap1"><div class="bar-fill" id="fill1"></div></div>
    <div class="portrait-wrap" id="portrait1"><div class="portrait-placeholder"></div></div>
    <div class="pct-label" id="pct1">0%</div>
    <div class="votes-label" id="votes1">0 votes</div>
  </div>
  <div class="bar-col" id="bar2">
    <div class="bar-wrap" id="bar-wrap2"><div class="bar-fill" id="fill2"></div></div>
    <div class="portrait-wrap" id="portrait2"><div class="portrait-placeholder"></div></div>
    <div class="pct-label" id="pct2">0%</div>
    <div class="votes-label" id="votes2">0 votes</div>
  </div>
</div>
<script>
  const root = document.getElementById('root');
  let wasActive = false;
  let animating = false;

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  function setPortrait(el, url) {
    if (url) {
      el.innerHTML = '<img src="' + url + '" alt="">';
    } else {
      el.innerHTML = '<div class="portrait-placeholder"></div>';
    }
  }

  // Clears animation effects but does NOT hide overlay or reset bar heights
  function resetWinnerState() {
    const label = document.getElementById('winner-label');
    if (label) { label.className = ''; label.textContent = ''; label.style.opacity = '0'; }
    const parts = document.getElementById('particles');
    if (parts) parts.innerHTML = '';
    ['bar1','bar2'].forEach(id => {
      const col = document.getElementById(id);
      if (col) { col.classList.remove('winner-anim'); col.style.opacity = ''; col.style.transition = ''; }
    });
    ['fill1','fill2'].forEach(id => {
      const f = document.getElementById(id);
      if (f) { f.style.transition = 'height 0.6s ease'; f.style.filter = ''; }
    });
  }

  // Full reset including bars/portraits — used when poll has 0 votes
  function fullReset() {
    resetWinnerState();
    document.getElementById('fill1').style.height = '0%';
    document.getElementById('fill2').style.height = '0%';
    document.getElementById('pct1').textContent = '0%';
    document.getElementById('pct2').textContent = '0%';
    document.getElementById('votes1').textContent = '0 votes';
    document.getElementById('votes2').textContent = '0 votes';
    setPortrait(document.getElementById('portrait1'), null);
    setPortrait(document.getElementById('portrait2'), null);
  }

  function spawnParticles(winIdx, color) {
    const partsEl = document.getElementById('particles');
    if (!partsEl) return;
    const winCol = document.getElementById('bar' + winIdx);
    if (!winCol) return;

    const colors = [color, '#ffffff', '#ffff66', color + 'bb'];
    const count  = 12;

    const colRect  = winCol.getBoundingClientRect();
    const rootRect = root.getBoundingClientRect();

    // Position relative to #root (which is position:relative)
    const relLeft = colRect.left - rootRect.left;
    const relTop  = colRect.top  - rootRect.top;

    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const px = relLeft + Math.random() * colRect.width;
      const py = relTop  + Math.random() * colRect.height * 0.6;
      const sz = 4 + Math.floor(Math.random() * 6);
      p.style.cssText = [
        'left:' + px + 'px',
        'top:' + py + 'px',
        'width:' + sz + 'px',
        'height:' + sz + 'px',
        'background:' + colors[Math.floor(Math.random() * colors.length)],
        'animation-delay:' + (Math.random() * 0.4).toFixed(2) + 's',
        'animation-duration:' + (0.7 + Math.random() * 0.5).toFixed(2) + 's'
      ].join(';');
      partsEl.appendChild(p);
    }
    // Clean up particles after animation completes
    setTimeout(() => { if (partsEl) partsEl.innerHTML = ''; }, 1800);
  }

  async function playWinnerAnimation(d) {
    animating = true;
    const v1 = (d.votes && d.votes['1']) || 0;
    const v2 = (d.votes && d.votes['2']) || 0;

    // No votes at all — hide overlay and fully reset
    if (v1 === 0 && v2 === 0) {
      root.classList.remove('visible');
      await sleep(1600);
      fullReset();
      animating = false;
      return;
    }

    const tied   = v1 === v2;
    const winIdx  = (!tied && v1 > v2) ? 1 : 2;
    const loseIdx = winIdx === 1 ? 2 : 1;

    // Phase 1 — shrink loser (1s)
    const loseCol  = document.getElementById('bar' + loseIdx);
    const loseFill = document.getElementById('fill' + loseIdx);
    if (loseFill) { loseFill.style.transition = 'height 0.9s ease'; loseFill.style.height = '0%'; }
    if (loseCol)  { loseCol.style.transition = 'opacity 0.7s ease'; loseCol.style.opacity = '0.18'; }

    await sleep(1050);

    if (!tied) {
      // Phase 2 — winner celebration
      const winCol   = document.getElementById('bar' + winIdx);
      const winFill  = document.getElementById('fill' + winIdx);
      const winColor = winIdx === 1
        ? (document.getElementById('fill1')?.style.background || '#3a9fc8')
        : (document.getElementById('fill2')?.style.background || '#ff6694');

      if (winCol)  winCol.classList.add('winner-anim');
      if (winFill) { winFill.style.filter = 'brightness(1.5)'; }

      // Show WINNER label
      const label = document.getElementById('winner-label');
      if (label) {
        const name = winIdx === 1
          ? (d.p1 && d.p1.name ? d.p1.name.toUpperCase() + ' WINS!' : 'WINNER!')
          : (d.p2 && d.p2.name ? d.p2.name.toUpperCase() + ' WINS!' : 'WINNER!');
        label.textContent = name;
        label.style.color = winColor;
        label.style.textShadow = '3px 3px 0 #000, 0 0 12px ' + winColor + '88';
        label.style.opacity = '';
        label.className = 'show';
      }

      // Spawn pixel particles
      spawnParticles(winIdx, winColor);

      await sleep(1950); // 3 × 0.65s bounce
    }

    // Overlay stays visible — no fade out
    animating = false;
  }

  function _shadowCss(sh) {
    if (!sh) sh = {};
    var a = sh.angle != null ? sh.angle : 135, d = sh.distance != null ? sh.distance : 8;
    var blur = sh.hardness != null ? sh.hardness : 0, spread = sh.spread != null ? sh.spread : 0;
    var color = sh.color || '#000000', op = sh.opacity != null ? sh.opacity : 1;
    var rad = a * Math.PI / 180;
    var x = Math.round(d * Math.sin(rad)), y = Math.round(-d * Math.cos(rad));
    var r = parseInt(color.slice(1,3)||'00',16), g = parseInt(color.slice(3,5)||'00',16), b = parseInt(color.slice(5,7)||'00',16);
    var col = 'rgba('+r+','+g+','+b+','+op+')';
    var val = x+'px '+y+'px '+blur+'px '+col;
    if (spread > 0) val += ', '+x+'px '+y+'px '+(blur+spread)+'px rgba('+r+','+g+','+b+','+Math.max(0,+(op-0.35).toFixed(2))+')';
    return val;
  }

  function applyPollSettings(ps) {
    if (!ps) return;
    const p1Color     = ps.p1Color     || '#3a9fc8';
    const p2Color     = ps.p2Color     || '#ff6694';
    const p1TextColor = ps.p1TextColor || p1Color;
    const p2TextColor = ps.p2TextColor || p2Color;
    const textShadow1 = _shadowCss(ps.shadow);
    const textShadow2 = textShadow1;
    const barWidth = ps.barWidth || 40;
    const barGap   = ps.barGap   || 12;
    const bgOpacity = ps.bgOpacity != null ? ps.bgOpacity : 0;
    const bgRadius  = ps.bgRadius  != null ? ps.bgRadius  : 0;
    const bgWidth   = ps.bgWidth   != null ? ps.bgWidth   : 200;
    const bgHeight  = ps.bgHeight  != null ? ps.bgHeight  : 300;
    const barRadius = ps.barRadius != null ? ps.barRadius : 0;
    const maxHeightEnabled = !!ps.maxHeightEnabled;
    const maxHeight = ps.maxHeight || 300;
    const pctSize  = ps.pctSize  || 18;
    const voteSize = ps.voteSize || 12;
    const pfpSize  = ps.pfpSize  || 80;

    root.style.gap = barGap + 'px';

    const bgEl = document.getElementById('poll-bg');
    if (bgEl) {
      bgEl.style.background   = bgOpacity > 0 ? 'rgba(3,12,28,' + bgOpacity + ')' : 'transparent';
      bgEl.style.borderRadius = bgRadius + 'px';
      bgEl.style.width        = bgWidth  + 'px';
      bgEl.style.height       = bgHeight + '%';
    }

    // Position winner label just above the top edge of the bg element
    const winLabel = document.getElementById('winner-label');
    if (winLabel) {
      const rootH = (root && root.clientHeight) ? root.clientHeight : 600;
      const bgTopPx = rootH * (1 - Math.min(bgHeight, 100) / 100);
      winLabel.style.top = Math.max(4, bgTopPx - 40) + 'px';
    }

    const bw1 = document.getElementById('bar-wrap1');
    if (bw1) { bw1.style.width = barWidth + 'px'; bw1.style.maxHeight = maxHeightEnabled ? maxHeight + 'px' : ''; }
    const bw2 = document.getElementById('bar-wrap2');
    if (bw2) { bw2.style.width = barWidth + 'px'; bw2.style.maxHeight = maxHeightEnabled ? maxHeight + 'px' : ''; }

    const f1 = document.getElementById('fill1');
    if (f1) { f1.style.background = p1Color; f1.style.borderRadius = barRadius + 'px ' + barRadius + 'px 0 0'; }
    const f2 = document.getElementById('fill2');
    if (f2) { f2.style.background = p2Color; f2.style.borderRadius = barRadius + 'px ' + barRadius + 'px 0 0'; }

    const pct1 = document.getElementById('pct1');
    if (pct1) { pct1.style.color = p1TextColor; pct1.style.fontSize = pctSize + 'px'; pct1.style.textShadow = textShadow1; }
    const pct2 = document.getElementById('pct2');
    if (pct2) { pct2.style.color = p2TextColor; pct2.style.fontSize = pctSize + 'px'; pct2.style.textShadow = textShadow2; }

    const v1el = document.getElementById('votes1'); if (v1el) { v1el.style.fontSize = voteSize + 'px'; v1el.style.textShadow = textShadow1; }
    const v2el = document.getElementById('votes2'); if (v2el) { v2el.style.fontSize = voteSize + 'px'; v2el.style.textShadow = textShadow2; }

    const pfpShape = ps.pfpShape || 'square';
    const overlap  = Math.round(pfpSize * 0.45);
    [document.getElementById('portrait1'), document.getElementById('portrait2')].forEach(p => {
      if (!p) return;
      p.style.width        = pfpSize + 'px';
      p.style.height       = pfpSize + 'px';
      p.style.borderRadius = pfpShape === 'modern' ? '50%' : '0';
      p.style.marginTop    = '-' + overlap + 'px';
    });
  }

  async function poll() {
    if (animating) return;
    try {
      const r = await fetch('/poll-status');
      const d = await r.json();

      applyPollSettings(d.pollSettings);

      if (d.active) {
        if (!wasActive) {
          // New poll starting — clear winner state from any previous poll
          resetWinnerState();
        }
        wasActive = true;
        root.classList.add('visible');

        setPortrait(document.getElementById('portrait1'), d.p1 && d.p1.imageUrl);
        setPortrait(document.getElementById('portrait2'), d.p2 && d.p2.imageUrl);

        document.getElementById('fill1').style.height = d.p1Pct + '%';
        document.getElementById('fill2').style.height = d.p2Pct + '%';
        document.getElementById('pct1').textContent = Math.round(d.p1Pct) + '%';
        document.getElementById('pct2').textContent = Math.round(d.p2Pct) + '%';
        document.getElementById('votes1').textContent = d.votes['1'] + ' vote' + (d.votes['1'] !== 1 ? 's' : '');
        document.getElementById('votes2').textContent = d.votes['2'] + ' vote' + (d.votes['2'] !== 1 ? 's' : '');
      } else {
        if (wasActive) {
          wasActive = false;
          playWinnerAnimation(d).catch(() => {
            animating = false;
          });
        }
      }
    } catch(e) {}
  }

  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>
