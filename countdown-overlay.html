<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --widget-font: 'MMRock9'; --cd-label-color: #aaa; --cd-time-color: #fff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; width:100vw; height:100vh; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  #cd-label { font-family:var(--widget-font,'MMRock9'),monospace; font-size:28px; color:var(--cd-label-color); letter-spacing:0.15em; text-transform:uppercase; text-shadow:var(--shadow,6px 6px 0 #000); }
  #cd-time  { font-family:var(--widget-font,'MMRock9'),monospace; font-size:96px; color:var(--cd-time-color); letter-spacing:0.05em; text-shadow:var(--shadow,6px 6px 0 #000); }
  #cd-time.urgent { color:#f87171; }
  #cd-time.blink { animation: slowblink 1.2s ease-in-out infinite; color:#f87171; }
  @keyframes slowblink {
    0%, 100% { opacity:1; }
    50% { opacity:0; }
  }
</style>
</head>
<body>
<div id="cd-label">Back in...</div>
<div id="cd-time">5:00</div>
<script>
  var hitZeroAt = null;

  function applyShadow(cfg) {
    var sh = cfg || {};
    var angle = sh.angle != null ? sh.angle : 135;
    var dist  = sh.distance != null ? sh.distance : 8;
    var blur  = sh.hardness != null ? sh.hardness : 0;
    var spread = sh.spread != null ? sh.spread : 0;
    var color = sh.color || '#000000';
    var opacity = sh.opacity != null ? sh.opacity : 1;
    var rad = angle * Math.PI / 180;
    var x = Math.round(dist * Math.sin(rad));
    var y = Math.round(-dist * Math.cos(rad));
    var r = parseInt(color.slice(1,3)||'00',16), g = parseInt(color.slice(3,5)||'00',16), b = parseInt(color.slice(5,7)||'00',16);
    var col = 'rgba('+r+','+g+','+b+','+opacity+')';
    var val = x+'px '+y+'px '+blur+'px '+col;
    if (spread > 0) val += ', '+x+'px '+y+'px '+(blur+spread)+'px rgba('+r+','+g+','+b+','+Math.max(0,+(opacity-0.35).toFixed(2))+')';
    document.documentElement.style.setProperty('--shadow', val);
  }

  var _lastShadowKey = '';
  async function poll() {
    try {
      const r = await fetch('/countdown-state'); const d = await r.json();
      document.getElementById('cd-label').textContent = d.label || 'Back in...';
      document.documentElement.style.setProperty('--cd-label-color', d.labelColor || '#aaa');
      document.documentElement.style.setProperty('--cd-time-color', d.timeColor || '#fff');
      var _sk = JSON.stringify(d.shadow||{});
      if (_sk !== _lastShadowKey) { _lastShadowKey = _sk; applyShadow(d.shadow); }

      const rem = Math.max(0, d.remaining);
      const mins = Math.floor(rem / 60000);
      const secs = Math.floor((rem % 60000) / 1000);
      document.getElementById('cd-time').textContent = mins + ':' + secs.toString().padStart(2,'0');

      const el = document.getElementById('cd-time');
      if (rem === 0 && d.running === false) {
        // Hit zero — start tracking blink time
        if (!hitZeroAt) hitZeroAt = Date.now();
        const elapsed = Date.now() - hitZeroAt;
        if (elapsed < 60000) {
          el.className = 'blink';
        } else {
          el.className = '';
          el.style.opacity = '1';
        }
      } else {
        hitZeroAt = null;
        el.className = rem < 60000 && rem > 0 ? 'urgent' : '';
      }
    } catch(e) {}
  }

  poll();
  setInterval(poll, 500);

  async function loadGlobalFont() {
    try {
      const r = await fetch('/font-info');
      const d = await r.json();
      const font = d.name || 'MMRock9';
      if (font !== 'monospace' && font !== 'sans-serif' && d.path) {
        if (!document.querySelector('style[data-font="' + font + '"]')) {
          const style = document.createElement('style');
          style.setAttribute('data-font', font);
          style.textContent = "@font-face { font-family:'" + font + "'; src:url('/font/" + d.path + "'); }";
          document.head.appendChild(style);
        }
      }
      document.documentElement.style.setProperty('--widget-font', "'" + font + "'");
    } catch(e) {}
  }
  loadGlobalFont();
  setInterval(loadGlobalFont, 10000);

</script>
</body>
</html>
